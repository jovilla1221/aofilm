<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOFilm — Cinema Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #faf6f0;
            --bg-surface: #fffaf2;
            --bg-card: #ffffff;
            --border: #e8ddd0;
            --gold: #b8860b;
            --gold-light: #d4a843;
            --terracotta: #c1694f;
            --olive: #7a8b5e;
            --text: #3d3229;
            --text-muted: #8a7a6a;
            --text-light: #b5a694;
            --shadow: rgba(139, 109, 80, 0.10);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 60px;
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(196, 164, 132, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 100%, rgba(196, 164, 132, 0.10) 0%, transparent 50%);
        }

        header {
            background: rgba(255, 250, 242, 0.88);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 14px 24px;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text);
        }
        .logo span { color: var(--terracotta); }

        .search-bar {
            flex: 1;
            max-width: 380px;
            position: relative;
        }
        .search-bar input {
            width: 100%;
            border-radius: 99px;
            padding: 10px 16px 10px 40px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            outline: none;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }
        .search-bar input:focus { border-color: var(--gold-light); }
        .search-bar input::placeholder { color: var(--text-light); }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--text-muted);
        }

        .btn-primary {
            background: var(--terracotta);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            padding: 10px 22px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .btn-primary:hover {
            background: #b05a42;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(193, 105, 79, 0.3);
        }

        main {
            max-width: 1200px;
            margin: 32px auto;
            padding: 0 24px;
        }

        .hero {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 20px 30px;
        }
        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--text);
            letter-spacing: -0.5px;
        }
        .hero h1 span { color: var(--terracotta); }
        .hero p {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-top: 8px;
            font-style: italic;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 36px;
        }

        .stat-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-val {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 800;
            color: var(--terracotta);
        }
        .stat-lbl {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .section-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .section-label h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text);
        }
        .section-label span {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 28px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            box-shadow: 0 2px 12px var(--shadow);
        }
        .card:hover {
            transform: translateY(-8px) scale(1.01);
            border-color: var(--gold-light);
            box-shadow: 0 16px 40px rgba(139, 109, 80, 0.18);
        }

        .poster-wrap {
            aspect-ratio: 2/3;
            width: 100%;
            position: relative;
            background: #f0ebe4;
            overflow: hidden;
        }
        .poster-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }
        .card:hover .poster-wrap img {
            transform: scale(1.05);
        }

        .badge-rating {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(255, 250, 242, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.3);
            color: var(--gold);
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 0.78rem;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: 'Inter', sans-serif;
        }

        .card-body {
            padding: 14px 16px 16px;
        }
        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.3;
        }
        .card-meta {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin: 4px 0 10px;
            letter-spacing: 0.3px;
        }
        .card-review {
            font-size: 0.8rem;
            color: #6b5d4f;
            background: #f4eee7;
            padding: 10px 12px;
            border-radius: 8px;
            font-style: italic;
            line-height: 1.4;
        }

        /* Modal */
        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(61, 50, 41, 0.6);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-bg.open { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(61, 50, 41, 0.2);
        }
        .modal-content h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 0.82rem;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            outline: none;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: var(--gold-light);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state p {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.1rem;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-light);
            font-size: 0.8rem;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <div class="logo">🎬 AO<span>Film</span></div>
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="searchInput" placeholder="Cari film...">
            </div>
            <button class="btn-primary" onclick="openModal()">✎ Log Film</button>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>Selamat Datang di <span>AOFilm</span></h1>
            <p>Jurnal pribadi untuk setiap perjalanan sinema</p>
        </section>

        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-val" id="statTotal">4</div>
                <div class="stat-lbl">Film Di-log</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="statAvgRating">5.0</div>
                <div class="stat-lbl">Rata-rata Rating</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="statTopGenre">Sci-Fi</div>
                <div class="stat-lbl">Top Genre</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="statLatest">—</div>
                <div class="stat-lbl">Terakhir Ditambahkan</div>
            </div>
        </section>

        <div class="section-label">
            <h2>Koleksi Film</h2>
            <span id="filmCount">4 film</span>
        </div>

        <section class="movie-grid" id="movieGrid"></section>
    </main>

    <footer>dibuat dengan 🎬 oleh <em>AO</em></footer>

    <!-- Modal Form -->
    <div class="modal-bg" id="modalBg">
        <div class="modal-content">
            <h2>✎ Log Film Baru</h2>
            <form id="filmForm">
                <div class="form-group">
                    <label>Judul Film</label>
                    <input type="text" id="title" required placeholder="e.g. Inception">
                </div>
                <div class="form-group">
                    <label>Tahun & Genre</label>
                    <div style="display:flex; gap: 10px;">
                        <input type="number" id="year" placeholder="2024" style="flex:1;">
                        <input type="text" id="genre" placeholder="Sci-Fi" style="flex:1;">
                    </div>
                </div>
                <div class="form-group">
                    <label>Rating (1–5)</label>
                    <select id="rating">
                        <option value="5">★★★★★ (5.0)</option>
                        <option value="4">★★★★☆ (4.0)</option>
                        <option value="3">★★★☆☆ (3.0)</option>
                        <option value="2">★★☆☆☆ (2.0)</option>
                        <option value="1">★☆☆☆☆ (1.0)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Ulasan Singkat</label>
                    <textarea id="review" rows="3" placeholder="Kesan setelah menonton..."></textarea>
                </div>
                <div style="display:flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                    <button type="button" onclick="closeModal()" style="padding: 10px 16px; background: transparent; border: 1px solid var(--border); color: var(--text-muted); border-radius: 8px; cursor: pointer;">Batal</button>
                    <button type="submit" class="btn-primary">Simpan Film</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const sampleMovies = [
            { id: 1, title: 'Spirited Away', year: 2001, genre: 'Animation', rating: 5, poster: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=800&auto=format&fit=crop', review: 'Keajaiban animasi klasik dari Studio Ghibli yang tak lekang waktu.' },
            { id: 2, title: 'Howl\'s Moving Castle', year: 2004, genre: 'Animation', rating: 5, poster: 'https://images.unsplash.com/photo-1511911063855-2bf39afa5b2e?q=80&w=800&auto=format&fit=crop', review: 'Kastil berjalan yang penuh sihir dan hati yang hangat.' },
            { id: 3, title: 'My Neighbor Totoro', year: 1988, genre: 'Animation', rating: 5, poster: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=800&auto=format&fit=crop', review: 'Kehangatan pedesaan Jepang yang terasa seperti pelukan.' },
            { id: 4, title: 'The Wind Rises', year: 2013, genre: 'Drama', rating: 4, poster: 'https://images.unsplash.com/photo-1440404653325-ab127d49abc1?q=80&w=800&auto=format&fit=crop', review: 'Mimpi dan pengorbanan dalam balutan kisah nyata sang arsitek pesawat.' }
        ];

        let movies = JSON.parse(localStorage.getItem('aofilm_list')) || sampleMovies;

        function getTopGenre(arr) {
            const counts = {};
            arr.forEach(m => { counts[m.genre] = (counts[m.genre] || 0) + 1; });
            let best = '', max = 0;
            for (const [g, c] of Object.entries(counts)) {
                if (c > max) { max = c; best = g; }
            }
            return best || '—';
        }

        function getAvgRating(arr) {
            if (!arr.length) return '—';
            const avg = arr.reduce((s, m) => s + Number(m.rating), 0) / arr.length;
            return avg.toFixed(1);
        }

        function render() {
            const grid = document.getElementById('movieGrid');
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = movies.filter(m => m.title.toLowerCase().includes(q) || m.genre.toLowerCase().includes(q));

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state"><p>⋯ Tidak ada film yang cocok</p></div>`;
            } else {
                grid.innerHTML = filtered.map(m => `
                    <div class="card">
                        <div class="poster-wrap">
                            <img src="${m.poster}" alt="${m.title}" loading="lazy">
                            <div class="badge-rating">★ ${Number(m.rating).toFixed(1)}</div>
                        </div>
                        <div class="card-body">
                            <div class="card-title">${m.title}</div>
                            <div class="card-meta">${m.year} • ${m.genre}</div>
                            <div class="card-review">"${m.review}"</div>
                        </div>
                    </div>
                `).join('');
            }

            document.getElementById('statTotal').innerText = movies.length;
            document.getElementById('statAvgRating').innerText = getAvgRating(movies);
            document.getElementById('statTopGenre').innerText = getTopGenre(movies);
            document.getElementById('statLatest').innerText = movies.length ? movies[0].year : '—';
            document.getElementById('filmCount').innerText = movies.length + ' film';
        }

        function openModal() { document.getElementById('modalBg').classList.add('open'); }
        function closeModal() { document.getElementById('modalBg').classList.remove('open'); }

        document.getElementById('filmForm').onsubmit = (e) => {
            e.preventDefault();
            const newM = {
                id: Date.now(),
                title: document.getElementById('title').value,
                year: document.getElementById('year').value || 2026,
                genre: document.getElementById('genre').value || 'Drama',
                rating: document.getElementById('rating').value,
                poster: 'https://images.unsplash.com/photo-1511911063855-2bf39afa5b2e?q=80&w=800&auto=format&fit=crop',
                review: document.getElementById('review').value || 'Film di-log baru.'
            };
            movies.unshift(newM);
            localStorage.setItem('aofilm_list', JSON.stringify(movies));
            closeModal();
            render();
            document.getElementById('filmForm').reset();
        };

        document.getElementById('searchInput').oninput = render;

        render();
    </script>
</body>
</html>
